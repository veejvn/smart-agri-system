services:
  postgres-auth:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: "${AUTH_DB_USER:?Set AUTH_DB_USER in deploy/compose/.env}"
      POSTGRES_PASSWORD: "${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in deploy/compose/.env}"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres-user:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: "${USER_DB_USER:?Set USER_DB_USER in deploy/compose/.env}"
      POSTGRES_PASSWORD: "${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in deploy/compose/.env}"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  discovery-service:
    build:
      context: ../../backend/discovery-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EUREKA_HOST: discovery-service
      EUREKA_USER: "${EUREKA_USER:?Set EUREKA_USER in deploy/compose/.env}"
      EUREKA_PASSWORD: "${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in deploy/compose/.env}"
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error --user "$${EUREKA_USER}:$${EUREKA_PASSWORD}" http://127.0.0.1:8761/actuator/health/readiness > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres-auth
      DB_PORT: "5432"
      DB_USER: "${AUTH_DB_USER:?Set AUTH_DB_USER in deploy/compose/.env}"
      DB_PASSWORD: "${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in deploy/compose/.env}"
      EUREKA_HOST: discovery-service
      EUREKA_USER: "${EUREKA_USER:?Set EUREKA_USER in deploy/compose/.env}"
      EUREKA_PASSWORD: "${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in deploy/compose/.env}"
      APP_JWT_SECRET: "${APP_JWT_SECRET:?Set APP_JWT_SECRET in deploy/compose/.env}"
    depends_on:
      postgres-auth:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  user-service:
    build:
      context: ../../backend/user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres-user
      DB_PORT: "5432"
      DB_USER: "${USER_DB_USER:?Set USER_DB_USER in deploy/compose/.env}"
      DB_PASSWORD: "${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in deploy/compose/.env}"
      EUREKA_HOST: discovery-service
      EUREKA_USER: "${EUREKA_USER:?Set EUREKA_USER in deploy/compose/.env}"
      EUREKA_PASSWORD: "${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in deploy/compose/.env}"
    depends_on:
      postgres-user:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8082/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EUREKA_HOST: discovery-service
      EUREKA_USER: "${EUREKA_USER:?Set EUREKA_USER in deploy/compose/.env}"
      EUREKA_PASSWORD: "${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in deploy/compose/.env}"
      APP_JWT_SECRET: "${APP_JWT_SECRET:?Set APP_JWT_SECRET in deploy/compose/.env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in deploy/compose/.env}"
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-8080}:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  backend:
    driver: bridge
    internal: true

volumes:
  auth-postgres-data:
  user-postgres-data:
