server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: crop-service
          uri: lb://crop-service
          predicates:
            - Path=/api/crops/**
        - id: weather-service
          uri: lb://weather-service
          predicates:
            - Path=/api/weather/**
        - id: forum-service
          uri: lb://forum-service
          predicates:
            - Path=/api/forum/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: ai-service
          uri: http://ai-service:8090 # Python service is not registered in Eureka, route directly
          predicates:
            - Path=/api/advice/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
