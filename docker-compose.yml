  # Infrastructure Management (Optional entry points)
  discovery-service:
    build:
      context: ./backend/discovery-service
    environment:
      - EUREKA_USER=${EUREKA_USER:-eureka}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-eureka}
    networks:
      - backend-net

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_USER=${EUREKA_USER:-eureka}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-eureka}
      - APP_JWT_SECRET=${JWT_SECRET}
    networks:
      - backend-net
      - agriculture-net

  auth-service:
    build:
      context: ./backend/auth-service
    depends_on:
      - discovery-service
      - postgres-auth
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_USER=${EUREKA_USER:-eureka}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-eureka}
      - DB_HOST=postgres-auth
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-auth:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - APP_JWT_SECRET=${JWT_SECRET}
    networks:
      - backend-net

  user-service:
    build:
      context: ./backend/user-service
    depends_on:
      - discovery-service
      - postgres-user
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_USER=${EUREKA_USER:-eureka}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-eureka}
      - DB_HOST=postgres-user
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user:5432/user_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    networks:
      - backend-net

