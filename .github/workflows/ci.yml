name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - crop-service
          - discovery-service
          - forum-service
          - notification-service
          - user-service
          - weather-service
    env:
      # Runtime secrets are required by gateway/auth-service; use dummy values for build/test.
      APP_JWT_SECRET: ci0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
      EUREKA_USER: eureka
      EUREKA_PASSWORD: eureka
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: mvn -B -ntp -DskipTests=false verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
