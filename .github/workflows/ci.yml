name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - crop-service
          - discovery-service
          - forum-service
          - notification-service
          - user-service
          - weather-service
    env:
      # Test-only placeholders; production secrets exist only in the protected deploy job.
      APP_JWT_SECRET: Y2ktb25seS1qd3Qta2V5LWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=
      EUREKA_USER: eureka
      EUREKA_PASSWORD: eureka
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: mvn -B -ntp -DskipTests=false verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080/api

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080/api

  image-check:
    name: container build check (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - discovery-service
          - auth-service
          - user-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.service }} without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend/${{ matrix.service }}
          file: backend/${{ matrix.service }}/Dockerfile
          push: false
          tags: local/smart-agri-system/${{ matrix.service }}:${{ github.sha }}

  images:
    name: build & push selected images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - e2e
      - compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ghcr-publish-${{ github.sha }}-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - discovery-service
          - auth-service
          - user-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check write-once commit tag
        id: tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SHA image tag already exists; preserving the existing image."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push ${{ matrix.service }}
        if: steps.tag.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend/${{ matrix.service }}
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-config:
    name: validate production Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose using safe placeholders
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          cat > "$env_file" <<'EOF'
          IMAGE_PREFIX=ghcr.io/example/smart-agri-system
          IMAGE_TAG=0123456789abcdef0123456789abcdef01234567
          AUTH_DB_USER=ci_auth_user
          AUTH_DB_PASSWORD=ci_only_auth_password
          USER_DB_USER=ci_user_user
          USER_DB_PASSWORD=ci_only_user_password
          EUREKA_USER=ci_registry_user
          EUREKA_PASSWORD=ci_only_registry_password
          APP_JWT_SECRET=Y2ktb25seS1qd3Qta2V5LWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=
          CORS_ALLOWED_ORIGINS=https://frontend.example.invalid
          GATEWAY_BIND_ADDRESS=127.0.0.1
          GATEWAY_HOST_PORT=8080
          EOF
          docker compose --env-file "$env_file" -f deploy/compose/compose.prod.yml config --quiet
          if docker compose -f deploy/compose/compose.prod.yml config --quiet >/dev/null 2>&1; then
            echo "Compose unexpectedly accepted missing required variables." >&2
            exit 1
          fi

  deploy:
    name: deploy to production VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: smart-agri-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare verified SSH access
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing production secret VPS_HOST}"
          : "${VPS_USER:?Missing production secret VPS_USER}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing production secret VPS_SSH_PRIVATE_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing production secret VPS_KNOWN_HOSTS}"
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_ed25519" "$RUNNER_TEMP/deploy-ssh/known_hosts"
          if ! ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/deploy-ssh/known_hosts" >/dev/null; then
            echo "VPS_HOST has no matching entry in VPS_KNOWN_HOSTS." >&2
            exit 1
          fi
      - name: Transfer deployment files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$RUNNER_TEMP/deploy-ssh/id_ed25519" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'install -d -m 700 /opt/smart-agri-system'
          scp "${ssh_opts[@]}" \
            deploy/compose/compose.prod.yml \
            deploy/ci-cd/deploy.sh \
            deploy/ci-cd/rollback.sh \
            "$VPS_USER@$VPS_HOST:/opt/smart-agri-system/"
      - name: Deploy exact commit SHA and verify health
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$RUNNER_TEMP/deploy-ssh/id_ed25519" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "bash /opt/smart-agri-system/deploy.sh '$GITHUB_SHA' '$GITHUB_ACTOR'"
      - name: Remove transient SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/deploy-ssh"
